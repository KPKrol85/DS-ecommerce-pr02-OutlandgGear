[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/kategoria.html"
  to = "/catalog.html"
  status = 301

[[redirects]]
  from = "/produkt.html"
  to = "/product.html"
  status = 301

[[redirects]]
  from = "/komplety.html"
  to = "/travel-kits.html"
  status = 301

[[redirects]]
  from = "/koszyk.html"
  to = "/cart.html"
  status = 301

[[redirects]]
  from = "/kontakt.html"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/kontakt-wyslano.html"
  to = "/contact-confirmation.html"
  status = 301

[[redirects]]
  from = "/checkout-potwierdzenie.html"
  to = "/checkout-confirmation.html"
  status = 301

[[redirects]]
  from = "/newsletter-potwierdzenie.html"
  to = "/newsletter-confirmation.html"
  status = 301

[[redirects]]
  from = "/o-nas.html"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/polityka-prywatnosci.html"
  to = "/privacy-policy.html"
  status = 301

[[redirects]]
  from = "/regulamin.html"
  to = "/terms.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fav-icons/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
